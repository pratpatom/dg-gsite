<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานความก้าวหน้าโครงการ</title>
    
    <!-- CDN Libraries -->
    <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        /* Custom styles for specific elements not covered by Tailwind */
        .stage-number {
            transition: all 0.3s ease;
        }
        .stage-progress {
            transition: width 0.8s ease-in-out;
        }
        
        /* Status color classes */
        .status-done { @apply bg-green-500; }
        .status-in-progress { @apply bg-blue-600; }
        .status-pending { @apply bg-gray-400; }
        
        .status-done-text { @apply bg-green-500 text-white; }
        .status-in-progress-text { @apply bg-blue-600 text-white; }
        .status-pending-text { @apply bg-gray-400 text-white; }
    </style>
</head>
<body class="bg-gray-100 p-5">
    <div id="app" class="max-w-6xl mx-auto">
        
        <!-- Loading State -->
        <div v-if="loading" class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-600">กำลังโหลดข้อมูล...</p>
            </div>
        </div>

        <!-- Main Content -->
        <div v-else-if="data && Object.keys(data).length > 0">
            <!-- Overview Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-5">
                <!-- Section Title -->
                <div class="lg:col-span-3 bg-white p-5 rounded-xl shadow-sm">
                    <h2 class="text-2xl font-bold text-gray-800">{{ data.overview?.title || 'ภาพรวม' }}</h2>
                </div>
                
                <!-- Metrics Cards -->
                <metric-card 
                    v-for="(metric, index) in data.overview?.metrics || []" 
                    :key="index"
                    :metric="metric"
                    :index="index">
                </metric-card>
            </div>

            <!-- Projects Section -->
            <project-card 
                v-for="project in data.projects || []" 
                :key="project.id"
                :project="project">
            </project-card>

            <!-- Success Factors and Obstacles -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
                <info-card 
                    v-for="section in data.successFactors || []" 
                    :key="section.title"
                    :section="section">
                </info-card>
            </div>

            <!-- Quarter Plan -->
            <quarter-plan v-if="data.quarterPlan" :plan="data.quarterPlan"></quarter-plan>
        </div>

        <!-- Error State -->
        <div v-else class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="text-red-500 text-6xl mb-4">⚠️</div>
                <p class="text-gray-600">ไม่สามารถโหลดข้อมูลได้</p>
                <button @click="loadData" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    ลองใหม่
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        const { createApp, ref, onMounted, computed } = Vue;

        // Metric Card Component
        const MetricCard = {
            props: ['metric', 'index'],
            template: `
                <div class="bg-white p-5 rounded-xl shadow-sm transform hover:scale-105 transition-transform duration-300">
                    <div class="text-center">
                        <div class="text-gray-600 text-lg mb-2">{{ metric.label }}</div>
                        <div class="text-4xl font-bold text-blue-600 mb-3" ref="valueRef">{{ metric.value }}</div>
                        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div 
                                class="h-full bg-blue-600 rounded-full transition-all duration-1000 ease-out"
                                :style="{ width: progressWidth + '%' }"
                                ref="progressRef">
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup(props) {
                const progressWidth = ref(0);
                const valueRef = ref(null);
                const progressRef = ref(null);

                onMounted(() => {
                    // Animate progress bar
                    setTimeout(() => {
                        progressWidth.value = props.metric.progress;
                    }, props.index * 200);

                    // GSAP animation for value
                    if (valueRef.value) {
                        gsap.fromTo(valueRef.value, 
                            { opacity: 0, y: 20 }, 
                            { opacity: 1, y: 0, duration: 0.6, delay: props.index * 0.1 }
                        );
                    }
                });

                return {
                    progressWidth,
                    valueRef,
                    progressRef
                };
            }
        };

        // Stage Component
        const StageItem = {
            props: ['stage', 'index'],
            template: `
                <div class="flex items-center mb-4 transform transition-all duration-300 hover:translate-x-2" ref="stageRef">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold mr-4 text-sm"
                         :class="stageStatusClass">
                        {{ stage.number }}
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-800 font-medium">{{ stage.title }}</span>
                            <span class="text-sm px-3 py-1 rounded-full text-white"
                                  :class="statusBadgeClass">
                                {{ statusText }}
                            </span>
                        </div>
                        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div 
                                class="h-full rounded-full transition-all duration-1000 ease-out"
                                :class="progressBarClass"
                                :style="{ width: progressWidth + '%' }">
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup(props) {
                const stageRef = ref(null);
                const progressWidth = ref(0);

                const stageStatusClass = computed(() => {
                    switch (props.stage.status) {
                        case 'done': return 'status-done';
                        case 'in-progress': return 'status-in-progress';
                        default: return 'status-pending';
                    }
                });

                const statusBadgeClass = computed(() => {
                    switch (props.stage.status) {
                        case 'done': return 'status-done-text';
                        case 'in-progress': return 'status-in-progress-text';
                        default: return 'status-pending-text';
                    }
                });

                const progressBarClass = computed(() => {
                    switch (props.stage.status) {
                        case 'done': return 'bg-green-500';
                        case 'in-progress': return 'bg-blue-600';
                        default: return 'bg-gray-400';
                    }
                });

                const statusText = computed(() => {
                    switch (props.stage.status) {
                        case 'done': return 'Done';
                        case 'in-progress': return props.stage.progress + '%';
                        default: return 'Pending';
                    }
                });

                onMounted(() => {
                    // Animate stage appearance
                    if (stageRef.value) {
                        gsap.fromTo(stageRef.value,
                            { opacity: 0, x: -30 },
                            { opacity: 1, x: 0, duration: 0.5, delay: props.index * 0.1 }
                        );
                    }

                    // Animate progress bar
                    setTimeout(() => {
                        progressWidth.value = props.stage.progress;
                    }, (props.index * 100) + 300);
                });

                return {
                    stageRef,
                    progressWidth,
                    stageStatusClass,
                    statusBadgeClass,
                    progressBarClass,
                    statusText
                };
            }
        };

        // Project Card Component
        const ProjectCard = {
            props: ['project'],
            components: {
                'stage-item': StageItem
            },
            template: `
                <div class="bg-white rounded-xl shadow-sm mb-6 overflow-hidden" ref="cardRef">
                    <div class="p-6">
                        <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center mb-6">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ project.title }}</h2>
                                <h3 class="text-lg text-gray-600">{{ project.subtitle }}</h3>
                            </div>
                            <a v-if="project.dashboardUrl" 
                               :href="project.dashboardUrl" 
                               target="_blank"
                               class="mt-4 lg:mt-0 bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-medium transition-colors duration-200 inline-block text-center">
                                Go to Dashboard
                            </a>
                        </div>
                        
                        <div class="space-y-0">
                            <stage-item 
                                v-for="(stage, index) in project.stages" 
                                :key="stage.number"
                                :stage="stage"
                                :index="index">
                            </stage-item>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const cardRef = ref(null);

                onMounted(() => {
                    if (cardRef.value) {
                        gsap.fromTo(cardRef.value,
                            { opacity: 0, y: 30 },
                            { opacity: 1, y: 0, duration: 0.6 }
                        );
                    }
                });

                return { cardRef };
            }
        };

        // Info Card Component
        const InfoCard = {
            props: ['section'],
            template: `
                <div class="bg-white rounded-xl shadow-sm p-6" ref="cardRef">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">{{ section.title }}</h2>
                    <div v-for="item in section.items" :key="item.category" 
                         class="mb-3 p-4 bg-gray-50 rounded-lg">
                        <div class="font-semibold text-gray-700 mb-2">{{ item.category }}:</div>
                        <div class="text-gray-600 whitespace-pre-line">{{ item.description }}</div>
                    </div>
                </div>
            `,
            setup() {
                const cardRef = ref(null);

                onMounted(() => {
                    if (cardRef.value) {
                        gsap.fromTo(cardRef.value,
                            { opacity: 0, scale: 0.95 },
                            { opacity: 1, scale: 1, duration: 0.5 }
                        );
                    }
                });

                return { cardRef };
            }
        };

        // Quarter Plan Component
        const QuarterPlan = {
            props: ['plan'],
            template: `
                <div class="bg-white rounded-xl shadow-sm p-6" ref="planRef">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ plan.title }}</h2>
                    <div v-for="section in plan.sections" :key="section.title" class="mb-6">
                        <h3 class="text-xl font-semibold text-gray-700 mb-4">{{ section.title }}</h3>
                        <div v-for="activity in section.activities" :key="activity.category"
                             class="mb-3 p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors duration-200">
                            <div class="font-semibold text-gray-700 mb-2">{{ activity.category }}:</div>
                            <div class="text-gray-600">{{ activity.description }}</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const planRef = ref(null);

                onMounted(() => {
                    if (planRef.value) {
                        gsap.fromTo(planRef.value,
                            { opacity: 0, y: 20 },
                            { opacity: 1, y: 0, duration: 0.6, delay: 0.3 }
                        );
                    }
                });

                return { planRef };
            }
        };

        // Main App
        const app = createApp({
            components: {
                'metric-card': MetricCard,
                'project-card': ProjectCard,
                'info-card': InfoCard,
                'quarter-plan': QuarterPlan
            },
            setup() {
                const data = ref({});
                const loading = ref(true);

                const loadData = async () => {
                    try {
                        const response = await fetch('https://raw.githubusercontent.com/pratpatom/dg-gsite/refs/heads/dev/data/dashboard_data.json');
                        data.value = await response.json();
                        loading.value = false;
                        
                        // Animate main container
                        gsap.fromTo('#app',
                            { opacity: 0 },
                            { opacity: 1, duration: 0.8 }
                        );
                    } catch (error) {
                        console.error('Error loading data:', error);
                        loading.value = false;
                    }
                };

                onMounted(() => {
                    loadData();
                });

                return {
                    data,
                    loading,
                    loadData
                };
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
